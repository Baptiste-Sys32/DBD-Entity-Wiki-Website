name: Content Guardrails

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    name: Data integrity + smoke + port status
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-entity-wiki
    steps:
      - name: Check out site repository
        uses: actions/checkout@v4

      # Peer checkout for parity-check. Works with the default token while both
      # repos are visible to it; if the app repo is private, add a PAT with
      # repo scope as APP_CHECKOUT_TOKEN and use it here instead.
      - name: Check out app repository (parity peer)
        uses: actions/checkout@v4
        with:
          repository: Baptiste-Sys32/DBD-Entity-Wiki-Android
          ref: modernize/vite-cap8
          path: dbd-app
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chrome (smoke test)
        id: chrome
        uses: browser-actions/setup-chrome@latest
        with:
          install-dependencies: true

      - name: Install JS + Python deps
        run: |
          npm ci
          pip install websockets

      - name: Resolve Chrome binary
        run: |
          test -x "${{ steps.chrome.outputs.chrome-path }}"
          echo "CHROME_BIN=${{ steps.chrome.outputs.chrome-path }}" >> $GITHUB_ENV

      - name: Data contract gates
        run: npm run check:data

      - name: Pipeline regression tests
        run: node --test scripts/maintenance.test.js

      - name: Generated bundles up to date
        run: node scripts/build-data.js --check

      - name: Offline runtime audit
        run: node scripts/verify-offline-runtime.js

      - name: Smoke test (headless Chrome)
        run: python3 scripts/smoke-test.py

      - name: App integrity and pending data-port report
        run: node scripts/parity-check.js --site-first --peer ../dbd-app/the-entity-wiki --json review/parity-report.json

      - name: Save parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: the-entity-wiki/review/parity-report.json
          if-no-files-found: warn
