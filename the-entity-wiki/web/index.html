  <script>
    (() => {
      const LAUNCH_TIPS = [
        'Do not tunnel the Sable players.',
        'Fixated is the best perk but no one wants to admit it.',
        'Hook pressure often wins more matches than a single overlong chase.',
        'Save exhaustion perks for distance, not comfort.',
        'Against ranged killers, cover and LOS matters.',
        'Do not stack on generators, optimum is 2 per generator.',
        'Doing gens? You?',
        'Try not to get gens done too quickly and end up in a 3 gen',
        'You have a 1 in 17 chance of seeing this loading screen tip.',
        'Healing is strongest way to relieve pressure, but it is not the only way.',
        'Nerf Trapper.',
        'DBD is so killer sided.',
        'DBD is so survivor sided.',
        'Nerf Pig.',
        'You summoned him, he came.',
        'Erm uh uhm',
        'Robin Buckley is the best legendary skin.',
      ];
      const overlay = document.getElementById('launch-overlay');
      const tipEl = document.getElementById('launch-overlay-tip');
      const startedAt = Date.now();
      const LAUNCH_OVERLAY_MIN_MS = 400;
      if (tipEl) {
        tipEl.textContent = LAUNCH_TIPS[Math.floor(Math.random() * LAUNCH_TIPS.length)];
      }
      window.__hideLaunchOverlay = (immediate = false) => {
        if (!overlay || overlay.dataset.hidden === 'true') return;
        const hide = () => {
          if (overlay.dataset.hidden === 'true') return;
          overlay.dataset.hidden = 'true';
          overlay.classList.add('launch-overlay--hidden');
          window.setTimeout(() => overlay.remove(), 640);
        };
        const minDuration = immediate ? 0 : LAUNCH_OVERLAY_MIN_MS;
        const remaining = Math.max(0, startedAt + minDuration - Date.now());
        window.setTimeout(hide, remaining);
      };
    })();
  </script>
